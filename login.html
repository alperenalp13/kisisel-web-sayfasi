<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi - Muhammet Alperen Alp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2 class="login-title">Yönetici Girişi</h2>
        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-white">Kullanıcı Adı</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-white">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-login">Giriş Yap</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Token'ı kaydet
                    localStorage.setItem('userRole', result.role);
                    localStorage.setItem('authToken', result.token);
                    window.location.href = '/';
                } else {
                    alert(result.message || 'Giriş başarısız!');
                }
            } catch (error) {
                console.error('Hata:', error);
                alert('Sunucu hatası oluştu.');
            }
        });
    </script>
</body>
</html>
