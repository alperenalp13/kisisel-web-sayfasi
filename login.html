<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi - Muhammet Alperen Alp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .login-title {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 2rem;
            font-family: 'Playfair Display', serif;
        }
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--primary-color);
            color: white;
            box-shadow: none;
        }
        .btn-login {
            background-color: var(--primary-color) !important;
            color: #1a1a2e !important;
            border: none;
            padding: 10px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 245, 201, 0.6);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .btn-login:hover {
            box-shadow: 0 0 25px rgba(0, 245, 201, 0.9);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="login-title">Yönetici Girişi</h2>
        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-white">Kullanıcı Adı</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-white">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-login">Giriş Yap</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Token'ı kaydet
                    localStorage.setItem('userRole', result.role);
                    localStorage.setItem('authToken', result.token);
                    window.location.href = '/';
                } else {
                    alert(result.message || 'Giriş başarısız!');
                }
            } catch (error) {
                console.error('Hata:', error);
                alert('Sunucu hatası oluştu.');
            }
        });
    </script>
</body>
</html>
