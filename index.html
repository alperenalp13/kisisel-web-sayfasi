<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammet Alperen Alp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>

    <!-- Login Modal (Required Static) -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card">
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">Giriş Yap</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginUsername" class="form-label" style="color: var(--primary-color);">Kullanıcı Adı</label>
                <input type="text" class="form-control" id="loginUsername" style="background-color: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); color: white;">
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label" style="color: var(--primary-color);">Şifre</label>
                <input type="password" class="form-control" id="loginPassword" style="background-color: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); color: white;">
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-3">Giriş Yap</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Project Modal -->
    <div class="modal fade" id="addProjectModal" tabindex="-1" aria-labelledby="addProjectModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card">
          <div class="modal-header">
            <h5 class="modal-title" id="addProjectModalLabel">Yeni Proje Ekle</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addProjectForm">
              <div class="mb-3">
                <label for="newProjectTitle" class="form-label" style="color: var(--primary-color);">Proje Başlığı</label>
                <input type="text" class="form-control" id="newProjectTitle" required>
              </div>
              <div class="mb-3">
                <label for="newProjectCardDesc" class="form-label" style="color: var(--primary-color);">Kısa Açıklama (Kartta Görünecek)</label>
                <textarea class="form-control" id="newProjectCardDesc" rows="2" required></textarea>
              </div>
               <div class="mb-3">
                <label for="newProjectCardImage" class="form-label" style="color: var(--primary-color);">Kapak Fotoğrafı (Kartta Görünecek)</label>
                <input type="file" class="form-control" id="newProjectCardImage" accept="image/*" required>
              </div>
              <div class="mb-3">
                <label for="newProjectModalDesc" class="form-label" style="color: var(--primary-color);">Detaylı Açıklama (Detay Penceresinde)</label>
                <textarea class="form-control" id="newProjectModalDesc" rows="4" required></textarea>
              </div>
              <div class="mb-3">
                <label for="newProjectImage" class="form-label" style="color: var(--primary-color);">Proje Resmi (Detay Penceresi)</label>
                <input type="file" class="form-control" id="newProjectImage" accept="image/*" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-3">Projeyi Oluştur</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Contact Modal -->
    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card">
          <div class="modal-header">
            <h5 class="modal-title" id="addContactModalLabel">Yeni İletişim Ekle</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addContactForm">
              <div class="mb-3">
                <label for="newContactTitle" class="form-label" style="color: var(--primary-color);">Başlık (örn: GitHub)</label>
                <input type="text" class="form-control" id="newContactTitle" required>
              </div>
              <div class="mb-3">
                <label for="newContactText" class="form-label" style="color: var(--primary-color);">Görünecek Metin (örn: /kullaniciadi)</label>
                <input type="text" class="form-control" id="newContactText" required>
              </div>
              <div class="mb-3">
                <label for="newContactHref" class="form-label" style="color: var(--primary-color);">Link (URL)</label>
                <input type="url" class="form-control" id="newContactHref" placeholder="https://github.com/...">
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-3">İletişim Bilgisi Ekle</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
